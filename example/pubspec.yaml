name: quill_delta_html_example
description: Example app demonstrating quill_delta_html lossless Delta <-> HTML round-trip with flutter_quill 11.x.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^3.6.1
  cupertino_icons: ^1.0.8
  dart_quill_delta: ^10.8.0
  file_picker: ^8.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.0.0
  html: ^0.15.4
  quill_delta_html:
    path: ../
  xml: ^6.5.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
