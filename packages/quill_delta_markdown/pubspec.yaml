name: quill_delta_markdown
description: >-
  Quill Delta <-> Markdown conversion. Pure Dart. Importer pivots through
  HTML; exporter walks Delta lines natively.
version: 0.1.1
repository: https://github.com/NeuralMobile/quill_delta_kit
issue_tracker: https://github.com/NeuralMobile/quill_delta_kit/issues
topics:
  - quill
  - delta
  - markdown
  - editor
  - converter

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  dart_quill_delta: ^10.8.0
  markdown: ^7.2.2
  quill_delta_core: ^0.1.0
  quill_delta_html: ^0.1.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
