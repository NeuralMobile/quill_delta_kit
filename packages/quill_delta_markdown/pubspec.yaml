name: quill_delta_markdown
description: >-
  Quill Delta <-> Markdown conversion. Pure Dart. Importer pivots through
  HTML; exporter walks Delta lines natively.
version: 0.1.0
repository: https://github.com/yourname/quill_delta_html

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  dart_quill_delta: ^10.8.0
  markdown: ^7.2.2
  quill_delta_core:
    path: ../quill_delta_core
  quill_delta_html:
    path: ../quill_delta_html

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
