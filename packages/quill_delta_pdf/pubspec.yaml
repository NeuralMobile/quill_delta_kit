name: quill_delta_pdf
description: >-
  Quill Delta -> PDF export. PDF -> Delta import is a stub.
  Pure Dart writer via package:pdf.
version: 0.1.0
publish_to: none
repository: https://github.com/yourname/quill_delta_html
issue_tracker: https://github.com/yourname/quill_delta_html/issues
topics:
  - quill
  - delta
  - pdf
  - export
  - converter

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  dart_quill_delta: ^10.8.0
  meta: ^1.16.0
  pdf: ^3.11.0
  quill_delta_core:
    path: ../quill_delta_core

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
