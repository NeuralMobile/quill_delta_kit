name: quill_delta_core
description: >-
  Core types and Delta utilities for the quill_delta_* converter family.
  Pure Dart, zero HTML/binary dependencies.
version: 0.1.0
repository: https://github.com/NeuralMobile/quill_delta_kit
issue_tracker: https://github.com/NeuralMobile/quill_delta_kit/issues
topics:
  - quill
  - delta
  - editor
  - converter
  - rich-text

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  collection: ^1.18.0
  dart_quill_delta: ^10.8.0
  meta: ^1.16.0
  # `test` is a runtime dep because the test contract suite (exposed via
  # `quill_delta_core_test_contract.dart`) is consumed by other format
  # packages' tests. Format packages don't need `test` as a separate dep.
  test: ^1.25.0

dev_dependencies:
  lints: ^4.0.0
