name: quill_delta_docx
description: >-
  Quill Delta <-> DOCX (Office Open XML) conversion. Pure Dart.
  Importer pivots through HTML; exporter writes OOXML directly.
version: 0.1.0
repository: https://github.com/NeuralMobile/quill_delta_kit
issue_tracker: https://github.com/NeuralMobile/quill_delta_kit/issues
topics:
  - quill
  - delta
  - docx
  - ooxml
  - converter

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  archive: ^3.6.0
  dart_quill_delta: ^10.8.0
  quill_delta_core: ^0.1.0
  quill_delta_html: ^0.1.0
  xml: ^6.5.0

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
