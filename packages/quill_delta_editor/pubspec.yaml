name: quill_delta_editor
description: >-
  Flutter wrapper around flutter_quill that bundles the quill_delta_*
  multi-format converter family with configurable toolbars, layout modes
  (scrollable / auto-grow / fixed / read-only), and pluggable media
  preview builders for auth-injected URLs.
version: 0.1.0
publish_to: none
repository: https://github.com/NeuralMobile/quill_delta_kit
issue_tracker: https://github.com/NeuralMobile/quill_delta_kit/issues
topics:
  - quill
  - flutter
  - editor
  - rich-text
  - wysiwyg

environment:
  sdk: ^3.6.0
  flutter: ">=3.16.0"

resolution: workspace

dependencies:
  dart_quill_delta: ^10.8.0
  flutter:
    sdk: flutter
  flutter_quill: ^11.0.0
  quill_delta_core: ^0.1.0
  quill_delta_docx: ^0.1.0
  quill_delta_html: ^0.1.0
  quill_delta_markdown: ^0.1.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
